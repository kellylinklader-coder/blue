# Blue Eye Recon Toolkit Configuration
# Toggle modules on/off and configure settings

target:
  domain: "example.com"
  company_name: "example"

modules:
  ip_geolocation: true
  http_headers: true
  nmap_scan: true
  dns_records: true
  certificates: true
  subdomains: true
  technologies: true
  github_users: true
  email_harvesting: true
  html_report: true

settings:
  timeout: 30
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_9_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/35.0.1916.47 Safari/537.36"
  delay_between_requests: 0.2
  
output:
  report_dir: "reports"
  log_dir: "logs"
  report_format: "html"  # html, json, txt
  verbose: true

subdomain_wordlist:
  - www
  - mail
  - ftp
  - localhost
  - webmail
  - smtp
  - pop
  - ns1
  - webdisk
  - ns2
  - cpanel
